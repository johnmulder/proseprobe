# Pre-commit hooks for ProseProbe
# Add to your .pre-commit-config.yaml:
#
# repos:
#   - repo: https://github.com/johnmulder/proseprobe
#     rev: v0.1.0
#     hooks:
#       - id: proseprobe
#
- id: proseprobe
  name: ProseProbe
  description: A Unix-style linter for common prose, documentation, and Markdown problems
  entry: proseprobe check
  language: python
  types_or: [markdown, python]
  require_serial: false
  minimum_pre_commit_version: '2.9.0'
