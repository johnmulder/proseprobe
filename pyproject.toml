[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slop-lint"
version = "0.1.0"
description = "Detect bad writing practices in Markdown and Python files"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "slop-lint contributors" },
]
keywords = [
    "writing",
    "linter",
    "markdown",
    "python",
    "documentation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
    "hypothesis>=6.0",
    "pre-commit>=3.0",
    "interrogate>=1.5",
]

[project.scripts]
slop-lint = "slop_lint.cli:main"

[project.urls]
Homepage = "https://github.com/slop-lint/slop-lint"
Documentation = "https://github.com/slop-lint/slop-lint#readme"
Repository = "https://github.com/slop-lint/slop-lint"
Issues = "https://github.com/slop-lint/slop-lint/issues"
Changelog = "https://github.com/slop-lint/slop-lint/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/slop_lint"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
exclude = ["venv", ".venv", "build", "dist"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "D",      # pydocstyle
    "PT",     # flake8-pytest-style
    "RUF",    # ruff-specific rules
    "S",      # flake8-bandit (security)
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "ARG001", # unused function argument (TODO stubs)
    "ARG002", # unused method argument (TODO stubs)
    "D102",   # missing docstring in public method (gradual adoption)
    "D107",   # missing docstring in __init__ (gradual adoption)
    "S101",   # assert used (expected in tests)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "S"]
"tests/fixtures/**/*.py" = ["D", "S"]
"tests/test_property.py" = ["RUF001"]
"benchmarks/**/*.py" = ["D"]

[tool.ruff.lint.isort]
known-first-party = ["slop_lint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.coverage.run]
source = ["src/slop_lint"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.interrogate]
ignore-init-method = true
ignore-init-module = true
ignore-magic = true
ignore-semiprivate = true
ignore-private = true
ignore-property-decorators = true
ignore-module = false
ignore-nested-functions = true
fail-under = 75
exclude = ["tests", "benchmarks"]
verbose = 0
