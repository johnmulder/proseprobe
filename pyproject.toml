[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "humanize-cli"
version = "0.1.0"
description = "Detect AI-generated content patterns in Markdown and Python files"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Your Name", email = "you@example.com" },
]
keywords = [
    "ai",
    "linter",
    "markdown",
    "python",
    "documentation",
    "writing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0",
    "mistune>=3.0",
    "regex>=2023.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
    "hypothesis>=6.0",
]

[project.scripts]
humanize = "humanize.cli:app"

[project.urls]
Homepage = "https://github.com/yourusername/humanize-cli"
Documentation = "https://github.com/yourusername/humanize-cli#readme"
Repository = "https://github.com/yourusername/humanize-cli"
Issues = "https://github.com/yourusername/humanize-cli/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/humanize"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
exclude = ["venv", ".venv", "build", "dist"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "ARG001", # unused function argument (TODO stubs)
    "ARG002", # unused method argument (TODO stubs)
]

[tool.ruff.lint.isort]
known-first-party = ["humanize"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.coverage.run]
source = ["src/humanize"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
